name: Release

on:
  workflow_call:
    inputs:
      recovery_tag:
        description: Draft or published release tag to qualify and publish
        required: false
        type: string
    secrets:
      RELEASE_PLEASE_TOKEN:
        required: true

permissions: {}

concurrency:
  group: ast-mcp-release
  queue: max

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.candidate.outputs.release_created }}
      tag_name: ${{ steps.candidate.outputs.tag_name }}
      candidate_sha: ${{ steps.candidate.outputs.candidate_sha }}
      release_id: ${{ steps.candidate.outputs.release_id }}
      draft: ${{ steps.candidate.outputs.draft }}
      legacy: ${{ steps.candidate.outputs.legacy }}
      published_recovery: ${{ steps.candidate.outputs.published_recovery }}
      prs_created: ${{ steps.release-pr.outputs.prs_created }}
      prs: ${{ steps.release-pr.outputs.prs }}
    steps:
      - name: Require main for release execution
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: googleapis/release-please-action@v5
        id: release
        if: inputs.recovery_tag == ''
        continue-on-error: true
        with:
          # Workflow changes in the release target require a workflow-scoped token.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          skip-github-pull-request: true
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Resolve immutable release candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CREATED_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
          RECOVERY_TAG: ${{ inputs.recovery_tag }}
        run: bun scripts/release/release-candidate.ts resolve
      - uses: googleapis/release-please-action@v5
        id: release-pr
        if: inputs.recovery_tag == '' && steps.candidate.outputs.release_created != 'true' && steps.candidate.outputs.pending_draft != 'true'
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          skip-github-release: true

  dispatch-ci:
    needs: release
    if: ${{ needs.release.outputs.prs_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install trusted repository tools
        run: bun ci
      - name: Stamp release documentation and validate the release PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PRS: ${{ needs.release.outputs.prs }}
        run: bun scripts/release/dispatch-release-ci.ts

  validate:
    permissions:
      contents: read
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/checkout-release-candidate
        with:
          sha: ${{ needs.release.outputs.candidate_sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache/restore@v6
        id: bun_cache
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'bun.lock') }}-v1
      - run: bun ci
      - uses: actions/cache/save@v6
        if: steps.bun_cache.outputs.cache-hit != 'true'
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'bun.lock') }}-v1
      - name: Qualify native dependencies
        env:
          AST_MCP_QUALIFY_EMBEDDINGS: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: bun run intelligence:qualify
      - name: Mandatory CLI MCP stdio handshake
        run: bun run test tests/integration/mcp.test.ts --test-name-pattern "CLI mcp subcommand remains alive for a stdio handshake"
      - name: Mandatory native MCP stdio initialize, tools, and workspace handshake
        run: bun run test tests/integration/mcp.test.ts --test-name-pattern "calls native code intelligence through the server"

  build:
    permissions:
      contents: read
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      native_npm: ${{ steps.pack.outputs.native_npm }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/checkout-release-candidate
        with:
          sha: ${{ needs.release.outputs.candidate_sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun ci
      - name: Validate tagged source
        env:
          AST_MCP_SKIP_PACKAGE_SMOKE: "1"
        run: bun run check
      - run: bun run skill:check
      - run: bun run evals:check
      - name: Restore the published package archive
        if: needs.release.outputs.published_recovery == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
          CANDIDATE_SHA: ${{ needs.release.outputs.candidate_sha }}
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
        run: bun scripts/release/release-candidate.ts restore-root "${RUNNER_TEMP}/package-artifact"
      - name: Build one package archive
        id: pack
        shell: bash
        env:
          PUBLISHED_RECOVERY: ${{ needs.release.outputs.published_recovery }}
        run: |
          mkdir -p "$RUNNER_TEMP/package-artifact"
          if [[ "$PUBLISHED_RECOVERY" == true ]]; then
            echo "native_npm=true" >> "$GITHUB_OUTPUT"
          elif [[ -f scripts/build/pack-npm.ts ]]; then
            bun scripts/build/pack-npm.ts root "$RUNNER_TEMP/package-artifact/ast-mcp.tgz"
            echo "native_npm=true" >> "$GITHUB_OUTPUT"
          else
            bun pm pack --filename "$RUNNER_TEMP/package-artifact/ast-mcp.tgz"
            echo "native_npm=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$PUBLISHED_RECOVERY" == true ]]; then exit 0; fi
          bun -e 'const path = process.env.RUNNER_TEMP + "/package-artifact/ast-mcp.tgz"; await Bun.write(path + ".sha256", new Bun.CryptoHasher("sha256").update(await Bun.file(path).arrayBuffer()).digest("hex") + "\n")'
      - uses: actions/upload-artifact@v7
        with:
          name: release-candidate
          path: ${{ runner.temp }}/package-artifact/*
          if-no-files-found: error
          retention-days: 7

  consumers:
    permissions:
      contents: read
    needs: [release, build]
    if: ${{ needs.release.outputs.release_created == 'true' }}
    uses: ./.github/workflows/package-consumers.yml
    with:
      artifact_name: release-candidate

  standalone:
    needs: [release, build]
    if: ${{ needs.release.outputs.release_created == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/standalone.yml
    with:
      ref: ${{ needs.release.outputs.candidate_sha }}
      package_artifact_name: release-candidate
      native_npm: ${{ needs.build.outputs.native_npm == 'true' }}
      recovery_tag: ${{ needs.release.outputs.published_recovery == 'true' && needs.release.outputs.tag_name || '' }}
      recovery_release_id: ${{ needs.release.outputs.release_id }}

  benchmarks:
    needs: [release, validate, build, consumers, standalone]
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun ci
      - uses: actions/download-artifact@v8
        with:
          name: standalone-release-matrix
          path: standalone-matrix
      - name: Measure and gate the qualified release binary
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
          CANDIDATE_SHA: ${{ needs.release.outputs.candidate_sha }}
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
          RECOVERY_TAG: ${{ inputs.recovery_tag }}
          RELEASE_DRAFT: ${{ needs.release.outputs.draft }}
        run: bun scripts/release/release-candidate.ts benchmark standalone-matrix "${RUNNER_TEMP}/release-benchmarks"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-benchmark-evidence
          path: ${{ runner.temp }}/release-benchmarks/*.json
          if-no-files-found: ${{ needs.release.outputs.legacy == 'true' && 'ignore' || 'error' }}
          retention-days: 30
      - name: Summarize benchmark failure
        if: failure()
        run: |
          echo '## Release benchmark gate failed' >> "$GITHUB_STEP_SUMMARY"
          echo 'Publication is blocked. Inspect the failed step logs and release-benchmark-evidence artifact for workload, report, or archive diagnostics.' >> "$GITHUB_STEP_SUMMARY"

  publish-standalone:
    needs: [release, validate, build, consumers, standalone, benchmarks]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/download-artifact@v8
        with:
          name: standalone-release-matrix
          path: standalone-matrix
      - uses: actions/download-artifact@v8
        if: needs.release.outputs.legacy != 'true'
        with:
          name: release-benchmark-evidence
          path: release-benchmarks
      - uses: actions/download-artifact@v8
        with:
          name: release-candidate
          path: package-artifact
      - name: Attach qualified assets and promote the gated draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
          CANDIDATE_SHA: ${{ needs.release.outputs.candidate_sha }}
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
          RECOVERY_TAG: ${{ inputs.recovery_tag }}
        run: |
          bun scripts/release/release-candidate.ts attach standalone-matrix release-benchmarks/release-benchmarks.json package-artifact/ast-mcp.tgz
          bun scripts/release/release-candidate.ts promote standalone-matrix release-benchmarks/release-benchmarks.json package-artifact/ast-mcp.tgz

  publish:
    needs:
      [
        release,
        validate,
        build,
        consumers,
        standalone,
        benchmarks,
        publish-standalone,
      ]
    if: ${{ needs.release.outputs.release_created == 'true' && needs.validate.result == 'success' && needs.consumers.result == 'success' && needs.standalone.result == 'success' && needs.benchmarks.result == 'success' && needs.publish-standalone.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    outputs:
      registry_version: ${{ steps.publish.outputs.registry_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/checkout-release-candidate
        with:
          sha: ${{ needs.release.outputs.candidate_sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Use npm with trusted publishing support
        run: npm install --global npm@12.2.0
      - uses: actions/download-artifact@v8
        with:
          name: release-candidate
          path: package-artifact
      - uses: actions/download-artifact@v8
        with:
          name: standalone-release-matrix
          path: standalone-matrix
      - name: Publish and verify the qualified npm archives
        id: publish
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          if [[ -f scripts/release/publish-npm.ts ]]; then
            bun scripts/release/publish-npm.ts "$RELEASE_TAG" package-artifact/ast-mcp.tgz standalone-matrix
            echo "registry_version=${RELEASE_TAG#ast-mcp-v}" >> "$GITHUB_OUTPUT"
          else
            read -r digest _ < <(sha256sum package-artifact/ast-mcp.tgz)
            test "$digest" = "$(cat package-artifact/ast-mcp.tgz.sha256)"
            npm publish ./package-artifact/ast-mcp.tgz --access public --provenance --ignore-scripts
          fi

  verify-registry:
    needs: [release, publish]
    if: ${{ needs.publish.outputs.registry_version != '' }}
    permissions:
      contents: read
    uses: ./.github/workflows/standalone.yml
    with:
      ref: ${{ needs.release.outputs.candidate_sha }}
      registry_version: ${{ needs.publish.outputs.registry_version }}

  publish-notes:
    needs: [release, publish-standalone, benchmarks]
    if: ${{ needs.publish-standalone.result == 'success' && needs.benchmarks.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/download-artifact@v8
        if: needs.release.outputs.legacy != 'true'
        with:
          name: release-benchmark-evidence
          path: release-benchmarks
      - name: Refresh benchmark documentation for the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
          CANDIDATE_SHA: ${{ needs.release.outputs.candidate_sha }}
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
        run: bun scripts/release/release-candidate.ts notes release-benchmarks/release-benchmarks.json
