name: Release

on:
  workflow_call:
    inputs:
      recovery_tag:
        description: Published release tag to validate and publish
        required: false
        type: string
    secrets:
      RELEASE_PLEASE_TOKEN:
        required: true

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created || steps.recover.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name || steps.recover.outputs.tag_name }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      prs: ${{ steps.release.outputs.prs }}
    steps:
      - name: Require main for release recovery
        if: inputs.recovery_tag != ''
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: googleapis/release-please-action@v5
        id: release
        if: inputs.recovery_tag == ''
        continue-on-error: true
        with:
          # Workflow changes in the release target require a workflow-scoped token.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      - uses: actions/checkout@v7
        if: inputs.recovery_tag != '' || steps.release.outcome == 'failure'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Recover an existing release
        id: recover
        if: inputs.recovery_tag != '' || steps.release.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_TAG: ${{ inputs.recovery_tag }}
          RELEASE_TAG: ${{ inputs.recovery_tag }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_TAG" ]]; then
            RELEASE_TAG="ast-mcp-v$(jq -r .version package.json)"
          fi
          [[ "$RELEASE_TAG" =~ ^ast-mcp-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          test "$(jq -r .draft <<<"$release")" = false
          target=$(jq -r .target_commitish <<<"$release")
          tag_commit=$(git rev-list -n 1 "$RELEASE_TAG")
          test "$tag_commit" = "$target"
          git merge-base --is-ancestor "$tag_commit" HEAD
          test "$(git show "$RELEASE_TAG:package.json" | jq -r .version)" = "${RELEASE_TAG#ast-mcp-v}"
          if [[ -z "$RECOVERY_TAG" ]]; then
            test "$tag_commit" = "$GITHUB_SHA"
          fi
          echo "release_created=true" >> "$GITHUB_OUTPUT"
          echo "tag_name=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  dispatch-ci:
    needs: release
    if: ${{ needs.release.outputs.prs_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install trusted repository tools
        run: bun ci
      - name: Format release changelogs and validate resulting commits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PRS: ${{ needs.release.outputs.prs }}
        run: bun scripts/release/dispatch-release-ci.ts

  validate:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag_name }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache/restore@v6
        id: bun_cache
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'bun.lock') }}-v1
      - run: bun ci
      - uses: actions/cache/save@v6
        if: steps.bun_cache.outputs.cache-hit != 'true'
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'bun.lock') }}-v1
      - name: Qualify native dependencies
        env:
          AST_MCP_QUALIFY_EMBEDDINGS: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: bun run intelligence:qualify
      - name: Mandatory CLI MCP stdio handshake
        run: bun test mcp.test.ts --test-name-pattern "CLI mcp subcommand remains alive for a stdio handshake"
      - name: Mandatory native MCP stdio initialize, tools, and workspace handshake
        run: bun test mcp.test.ts --test-name-pattern "calls native code intelligence through the server"

  publish:
    needs: [release, validate]
    if: ${{ needs.release.outputs.release_created == 'true' && needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use npm with trusted publishing support
        run: npm install --global npm@12.2.0
      - uses: actions/cache/restore@v6
        id: bun_cache
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'bun.lock') }}-v1
      - run: bun ci
      - uses: actions/cache/save@v6
        if: steps.bun_cache.outputs.cache-hit != 'true'
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'bun.lock') }}-v1
      - name: Verify tagged package and build extracted distribution
        env:
          AST_MCP_SKIP_PACKAGE_SMOKE: "0"
        run: bun run check
      - run: bun run skill:check
      - run: bun run evals:check
      - run: npm publish --access public --provenance --ignore-scripts
