# The build script passes the CLI entry to Bun programmatically. Intelligence
# fixtures are dynamically loaded by source-owned tests as test runtime roots.
entry = [
  "bin/ast-mcp.ts",
  "scripts/testing/regenerate-document-goldens.ts",
  # Spawned collection generation and Tailwind CLI inputs.
  "website/scripts/generate-data.ts",
  "website/src/styles/app.css",
  "tests/fixtures/intelligence/**/*.{ts,tsx,js,jsx,mts,cts,mjs,cjs,mdx,astro,vue,svelte}",
]

# Generated host-install surfaces and the standalone evaluator policy mirror are
# validated by source-owned tests.
ignorePatterns = [
  ".github/hooks/**",
  ".github/skills/**",
  "templates/skills/ast-mcp/evals/shell-policy.ts",
  # Standalone exported adapters mirror runtime sources; templates:check enforces bytes.
  "templates/skills/ast-mcp/scripts/binary-resolution.ts",
  "templates/skills/ast-mcp/scripts/managed-hook.ts",
  "templates/skills/ast-mcp/scripts/release.ts",
]

# Fumadocs generates collection aliases, and parser fixtures intentionally
# reference absent sibling modules to verify unresolved-import graph output.
ignoreUnresolvedImports = [
  "./missing-parser-worker.ts",
  "./render",
  "./render.js",
  "./base",
  "./base.js",
  "collections/browser",
  "collections/server",
]

# The Svelte fixture exercises framework parsing without installing Svelte.
# Asset-only WASM providers and Transformers' undeclared runtime edge.
# The LanceDB facade is bundled from a build-only dependency; its upstream
# dynamic loader resolves direct optional native packages in installed consumers.
# Static analysis cannot inspect that bundled facade or its platform selection.
ignoreDependencies = [
  # The native grammar catalog loads these package assets on demand with createRequire.
  # The package and standalone native qualification suites exercise their registrations.
  "@ast-grep/lang-bash",
  "@ast-grep/lang-c",
  "@ast-grep/lang-cpp",
  "@ast-grep/lang-csharp",
  "@ast-grep/lang-dart",
  "@ast-grep/lang-elixir",
  "@ast-grep/lang-go",
  "@ast-grep/lang-java",
  "@ast-grep/lang-kotlin",
  "@ast-grep/lang-lua",
  "@ast-grep/lang-markdown",
  "@ast-grep/lang-php",
  "@ast-grep/lang-python",
  "@ast-grep/lang-ruby",
  "@ast-grep/lang-rust",
  "@ast-grep/lang-scala",
  "@ast-grep/lang-sql",
  "@ast-grep/lang-swift",
  "@ast-grep/lang-toml",
  "@ast-grep/lang-yaml",
  "@lancedb/lancedb",
  "@lancedb/lancedb-darwin-arm64",
  "@lancedb/lancedb-linux-arm64-gnu",
  "@lancedb/lancedb-linux-arm64-musl",
  "@lancedb/lancedb-linux-x64-gnu",
  "@lancedb/lancedb-linux-x64-musl",
  "@lancedb/lancedb-win32-arm64-msvc",
  "@lancedb/lancedb-win32-x64-msvc",
  "collections",
  "svelte",
  "onnxruntime-common",
  "tree-sitter-systemverilog",
  "tree-sitter-wasm",
]

# Schemas and types frequently validate sibling declarations in the same contract file.
ignoreExportsUsedInFile = true

[duplicates]
# Surface every duplicated pair so architectural consolidation is comprehensive.
minOccurrences = 2

# Reviewed semantic boundaries, with exact content fingerprints and instance counts.
# Fallow #3292 replaced order-based empty-token collision IDs with lexical hashes:
# https://github.com/fallow-rs/fallow/pull/3292
# All 48 fragments below predate this dependency upgrade and match the HEAD baseline.
ignoredClones = [
  # Configuration permits relative explicit storage; workspace contracts require absolute paths.
  "dup:1aefd42b:2",
  # Filesystem registrations preserve distinct mutation schemas, annotations, and lifecycle handlers.
  "dup:f3e16354:4",
  # Persisted configuration and the configuration-edit tool have distinct nullable edit semantics.
  "dup:a244fac5:2",
  # Worker messages and module-resolution inputs validate records at separate trust boundaries.
  "dup:d0cd0ab9:2",
  # Worker-side and client-side validators inspect different supported syntax-fact families.
  "dup:a3f100e7:2",
  # Service install and removal retain separate preflight and prior-state recovery paths.
  "dup:891f2ff6:2",
  # Transformer and Potion adapters preserve provider-specific managed-session construction.
  "dup:cf778614:2",
  # Generation evidence contracts and tool inputs enforce different range and request schemas.
  "dup:1c936c75:2",
  # Resolved configuration requires values; user configuration accepts optional snake-case inputs.
  "dup:bb5d6c95:2",
  # Infrastructure and legacy language workers hash their independently supported fact families.
  "dup:f782d1f2:2",
  # Formatter edit inputs permit clearing a path; persisted formatter configuration does not.
  "dup:0c4d2d6e:2",
  # Persisted MCP settings and edit-tool settings belong to separate full configuration schemas.
  "dup:79430155:2",
  # Mutation commit and rollback synchronization preserve opposite rename-recovery directions.
  "dup:7b5c3689:2",
  # Host install and uninstall enumerate targets within distinct transaction lifecycles.
  "dup:ad7da736:2",
  # Service-state queries and service mutations retain different subprocess interruption contracts.
  "dup:cbb5fdb4:2",
  # Persisted safety settings and configuration edits have distinct hook bounds and clear semantics.
  "dup:f92fa2bc:2",
  # Embedded calls and references remap different entity fields and identity inputs.
  "dup:029b70b0:2",
  # Recovery validates retained snapshot and live-file descriptors in separate ownership lifetimes.
  "dup:ed6c5879:2",
  # Lexical and vector retrieval retain different tables, result decoding, and search semantics.
  "dup:e2603a8f:2",
  # Transformer and Potion adapters own independent close state and isolated sessions.
  "dup:e7d540ae:2",
  # Topic words and relation summaries rank distinct evidence and produce different labels.
  "dup:a4bef96e:2",
  # Transformer and Potion providers invoke different session APIs and normalize different outputs.
  "dup:38a31906:2",
  # Bounded release HTTP reads and cancellable subprocess reads retain distinct stream policies.
  "dup:89e3c7c0:2",
  # The independently installed skill smoke and the server sanitize their own Git subprocess environments.
  "dup:f18dfc8c:2",
]

[rules]
# Legacy external-interface suppressions are retained for compatibility with Fallow's
# inability to model MCP Transport dispatch.
stale-suppressions = "off"
