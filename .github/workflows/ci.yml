name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact release PR commit to validate
        required: false
        type: string
      recovery_tag:
        description: Published release tag to validate and publish
        required: false
        type: string
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.expected_sha || inputs.recovery_tag || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      package: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.package }}
      release: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.release }}
      templates: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.templates }}
      website: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.website }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.expected_sha || github.sha }}
      - name: Verify dispatched request
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RECOVERY_TAG: ${{ inputs.recovery_tag }}
        run: |
          if [[ -n "$EXPECTED_SHA" && -n "$RECOVERY_TAG" ]] || [[ -z "$EXPECTED_SHA" && -z "$RECOVERY_TAG" ]]; then exit 1; fi
          if [[ -n "$EXPECTED_SHA" ]]; then
            test "$GITHUB_SHA" = "$EXPECTED_SHA" && test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          else
            test "$GITHUB_REF" = refs/heads/main && test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          fi
      - uses: dorny/paths-filter@v4
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          filters: |
            package:
              - 'LICENSE'
              - 'README.md'
              - 'bin/**'
              - '.oxfmtrc.json'
              - 'bun.lock'
              - 'bunfig.toml'
              - 'docker/**'
              - 'fallow.toml'
              - 'logo.svg'
              - 'osv-scanner.toml'
              - 'package.json'
              - 'scripts/**'
              - 'src/**'
              - 'templates/**'
              - 'tests/**'
              - 'tsconfig.json'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
              - '.github/workflows/package-consumers.yml'
            release:
              - 'bun.lock'
              - 'bunfig.toml'
              - 'release-please-config.json'
              - '.release-please-manifest.json'
              - '.github/workflows/release.yml'
              - 'bin/**'
              - 'package.json'
              - 'scripts/**'
              - 'src/**'
              - 'templates/**'
            templates:
              - 'templates/**'
            website:
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/ci.yml'
              - 'website/**'
              - '.github/workflows/docs.yml'

  package-static:
    name: Package static checks and distribution
    needs: changes
    if: ${{ needs.changes.outputs.package == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache/restore@v6
        id: bun_cache
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'bun.lock') }}-v1
      - name: Install package dependencies
        run: bun ci
      - uses: actions/cache/save@v6
        if: steps.bun_cache.outputs.cache-hit != 'true'
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'bun.lock') }}-v1
      - run: bun run tools:check
      - run: bun run templates:check
      - run: bun run prose:check
      - run: bun run lint
      - name: Validate skill
        if: ${{ needs.changes.outputs.templates == 'true' }}
        run: bun run skill:check
      - name: Validate evaluation fixtures
        if: ${{ needs.changes.outputs.templates == 'true' }}
        run: bun run evals:check
      - uses: actions/cache/restore@v6
        id: website_bun_cache
        with:
          path: ~/.bun/install/cache
          key: website-bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'website/package.json', 'website/bun.lock') }}-v1
      - name: Install website dependencies for Fallow
        run: bun ci --cwd website
      - uses: actions/cache/save@v6
        if: steps.website_bun_cache.outputs.cache-hit != 'true'
        with:
          path: ~/.bun/install/cache
          key: website-bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'website/package.json', 'website/bun.lock') }}-v1
      - name: Check dead code
        run: bun run fallow
      - name: Build one package archive
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/package-artifact"
          bun pm pack --filename "$RUNNER_TEMP/package-artifact/ast-mcp.tgz"
          bun -e 'const path = process.env.RUNNER_TEMP + "/package-artifact/ast-mcp.tgz"; await Bun.write(path + ".sha256", new Bun.CryptoHasher("sha256").update(await Bun.file(path).arrayBuffer()).digest("hex") + "\n")'
      - uses: actions/upload-artifact@v7
        with:
          name: package-candidate
          path: ${{ runner.temp }}/package-artifact/*
          if-no-files-found: error
          retention-days: 7

  package-consumers:
    name: Packed package consumers
    needs: [changes, package-static]
    if: ${{ needs.changes.outputs.package == 'true' }}
    uses: ./.github/workflows/package-consumers.yml
    with:
      artifact_name: package-candidate
      ref: ${{ inputs.expected_sha || github.sha }}

  package-coverage:
    name: Package tests and 95% coverage (Linux)
    needs: changes
    if: ${{ needs.changes.outputs.package == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache/restore@v6
        id: bun_cache
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'bun.lock') }}-v1
      - run: bun ci
      - uses: actions/cache/save@v6
        if: steps.bun_cache.outputs.cache-hit != 'true'
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'bun.lock') }}-v1
      - name: Warm formatter plugins
        run: bun run tools:check
      - name: Test package with 95% coverage
        env:
          AST_MCP_SKIP_PACKAGE_SMOKE: "1"
        run: bun run test:coverage

  package-platform-tests:
    name: Package tests (${{ matrix.os }}, shard ${{ matrix.shard }})
    needs: changes
    if: ${{ needs.changes.outputs.package == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        shard: [0, 1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache/restore@v6
        id: bun_cache
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'bun.lock') }}-v1
      - run: bun ci
      - uses: actions/cache/save@v6
        if: steps.bun_cache.outputs.cache-hit != 'true'
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'bun.lock') }}-v1
      - name: Warm formatter plugins
        run: bun run tools:check
      - name: Test package shard
        env:
          AST_MCP_SKIP_PACKAGE_SMOKE: "1"
        run: bun scripts/testing/test-shard.ts --shard ${{ matrix.shard }} --shards 3

  package-native:
    name: Native package qualification (${{ matrix.os }})
    needs: changes
    if: ${{ needs.changes.outputs.package == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache/restore@v6
        id: bun_cache
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'bun.lock') }}-v1
      - run: bun ci
      - uses: actions/cache/save@v6
        if: steps.bun_cache.outputs.cache-hit != 'true'
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'bun.lock') }}-v1
      - name: Qualify native dependencies
        env:
          AST_MCP_QUALIFY_EMBEDDINGS: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: bun run intelligence:qualify
      - name: Verify CLI MCP stdio handshake
        run: bun test tests/integration/mcp.test.ts --test-name-pattern "CLI mcp subcommand remains alive for a stdio handshake"
      - name: Verify native MCP stdio handshake
        run: bun test tests/integration/mcp.test.ts --test-name-pattern "calls native code intelligence through the server"

  website:
    name: Website validation
    needs: changes
    if: ${{ needs.changes.outputs.website == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache/restore@v6
        id: bun_cache
        with:
          path: ~/.bun/install/cache
          key: website-bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'website/package.json', 'website/bun.lock') }}-v1
      - name: Install website dependencies
        run: bun ci --cwd website
      - uses: actions/cache/save@v6
        if: steps.bun_cache.outputs.cache-hit != 'true'
        with:
          path: ~/.bun/install/cache
          key: website-bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'website/package.json', 'website/bun.lock') }}-v1
      - name: Lint website
        run: bun run --cwd website lint
      - name: Test website
        run: bun run --cwd website test
      - name: Install Chromium for browser regressions
        run: bun run --cwd website playwright install --with-deps chromium
      - name: Validate root and Pages builds and browser behavior
        run: bun run --cwd website test:browser

  release:
    name: Release
    needs:
      [
        changes,
        package-static,
        package-consumers,
        package-coverage,
        package-platform-tests,
        package-native,
        website,
      ]
    if: ${{ always() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.recovery_tag != '')) && needs.changes.outputs.release == 'true' && needs.package-static.result == 'success' && needs.package-consumers.result == 'success' && needs.package-coverage.result == 'success' && needs.package-platform-tests.result == 'success' && needs.package-native.result == 'success' && (needs.website.result == 'success' || needs.website.result == 'skipped') }}
    uses: ./.github/workflows/release.yml
    with:
      recovery_tag: ${{ inputs.recovery_tag }}
    secrets:
      RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
    permissions:
      actions: write
      contents: write
      id-token: write
      pull-requests: write
