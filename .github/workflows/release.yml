name: Release

on:
  workflow_call:

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  validate:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag_name }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: bun ci
      - name: Cache Windows Cargo comparator build
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/ast-bro-cargo-target
          key: ast-bro-4.2.0-${{ runner.os }}-${{ runner.arch }}-cargo-v1
      - name: Provision pinned benchmark comparators
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/ast-bro-cargo-target
        run: bun run comparators:provision
      - run: bun run intelligence:qualify
      - name: Run required intelligence benchmark
        env:
          AST_MCP_REQUIRE_COMPARATORS: "1"
        run: bun run intelligence:benchmark
      - name: Mandatory native MCP stdio initialize, tools, and workspace handshake
        run: bun test tests/mcp.test.ts --test-name-pattern "calls native code intelligence through the server"

  publish:
    needs: [release, validate]
    if: ${{ needs.release.outputs.release_created == 'true' && needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use npm with trusted publishing support
        run: npm install --global npm@11.17.0
      - run: bun ci
      - run: bun run check
      - run: bun run skill:check
      - run: bun run evals:check
      - run: bun run build
      - run: npm publish --access public --provenance --ignore-scripts
