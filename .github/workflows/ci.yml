name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      package: ${{ steps.filter.outputs.package }}
      release: ${{ steps.filter.outputs.release }}
      templates: ${{ steps.filter.outputs.templates }}
      website: ${{ steps.filter.outputs.website }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            package:
              - 'LICENSE'
              - 'README.md'
              - 'bin/**'
              - 'biome.jsonc'
              - 'bun.lock'
              - 'bunfig.toml'
              - 'dprint.json'
              - 'fallow.toml'
              - 'logo.svg'
              - 'osv-scanner.toml'
              - 'package.json'
              - 'scripts/**'
              - 'src/**'
              - 'templates/**'
              - 'tests/**'
              - 'tsconfig.json'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
            release:
              - 'bin/**'
              - 'dprint.json'
              - 'package.json'
              - 'scripts/**'
              - 'src/**'
              - 'templates/**'
            templates:
              - 'templates/**'
            website:
              - 'website/**'
              - '.github/workflows/docs.yml'

  package:
    name: Package validation (${{ matrix.os }})
    needs: changes
    if: ${{ needs.changes.outputs.package == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install package dependencies
        run: bun ci
      - name: Cache Windows Cargo comparator build
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/ast-bro-cargo-target
          key: ast-bro-4.2.0-${{ runner.os }}-${{ runner.arch }}-cargo-v1
      - name: Provision pinned benchmark comparators
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/ast-bro-cargo-target
        run: bun run comparators:provision
      - name: Verify package with coverage
        if: runner.os == 'Linux'
        run: bun run check:coverage
      - name: Verify package
        if: runner.os != 'Linux'
        run: bun run check
      - name: Qualify native dependencies
        env:
          AST_MCP_QUALIFY_EMBEDDINGS: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: bun run intelligence:qualify
      - name: Run required intelligence benchmark
        env:
          AST_MCP_REQUIRE_COMPARATORS: "1"
        run: bun run intelligence:benchmark
      - name: Verify native MCP stdio handshake
        run: bun test tests/mcp.test.ts --test-name-pattern "calls native code intelligence through the server"
      - name: Validate skill
        if: ${{ needs.changes.outputs.templates == 'true' }}
        run: bun run skill:check
      - name: Validate evaluation fixtures
        if: ${{ needs.changes.outputs.templates == 'true' }}
        run: bun run evals:check
      - name: Install website dependencies for Fallow
        if: runner.os == 'Linux'
        run: bun ci --cwd website
      - name: Check dead code
        if: runner.os == 'Linux'
        run: bun run fallow
      - name: Build distribution CLI
        run: bun run build
      - name: Verify package contents
        run: bun pm pack --dry-run

  website:
    name: Website validation
    needs: changes
    if: ${{ needs.changes.outputs.website == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install website dependencies
        run: bun ci --cwd website
      - name: Lint website
        run: bun run --cwd website lint
      - name: Typecheck website
        run: bun run --cwd website typecheck
      - name: Test website
        run: bun run --cwd website test
      - name: Build website
        env:
          VITE_BASE_PATH: /ast-mcp/
        run: bun run --cwd website build

  release:
    name: Release
    needs: [changes, package, website]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.release == 'true' && needs.package.result == 'success' && (needs.website.result == 'success' || needs.website.result == 'skipped') }}
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      id-token: write
      pull-requests: write
