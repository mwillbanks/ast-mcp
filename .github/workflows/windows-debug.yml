name: Windows debug session

on:
  pull_request:
    paths:
      - '.github/workflows/windows-debug.yml'

permissions:
  contents: read

jobs:
  windows-debug:
    if: github.head_ref == 'codex/feat/native-intelligence'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun ci
      - name: One-time Windows debug shell
        shell: pwsh
        timeout-minutes: 60
        env:
          DEBUG_TARGET: ${{ secrets.AST_MCP_WINDOWS_DEBUG_TARGET }}
          DEBUG_CIPHER: ${{ secrets.AST_MCP_WINDOWS_DEBUG_CIPHER }}
        run: |
          if ($env:DEBUG_TARGET -notmatch '^[A-Za-z0-9]{16,64}$' -or
              $env:DEBUG_CIPHER -notmatch '^[A-Za-z0-9]{16,64}$') {
            throw 'Missing or invalid one-time shell keys'
          }
          [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.SecurityProtocolType]::Tls12
          $script = (New-Object System.Net.WebClient).DownloadString('https://lets.tunshell.com/init.ps1')
          & ([scriptblock]::Create($script)) T $env:DEBUG_TARGET $env:DEBUG_CIPHER
