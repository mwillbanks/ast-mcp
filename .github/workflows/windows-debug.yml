name: Windows debug session

on:
  pull_request:
    paths:
      - '.github/workflows/windows-debug.yml'

permissions:
  contents: read

jobs:
  windows-debug:
    if: github.head_ref == 'codex/feat/native-intelligence'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun ci
      - name: Authenticated Windows debug shell
        id: tmate
        uses: mxschmitt/action-tmate@v3.24
        with:
          limit-access-to-actor: true
          detached: true
      - name: Save restricted SSH address
        shell: pwsh
        run: |
          $address = '${{ steps.tmate.outputs.ssh-address }}'
          if ($address -notmatch '^[A-Za-z0-9]+@ssh[.]tmate[.]io$') { throw 'Invalid SSH address' }
          Set-Content -LiteralPath "$env:RUNNER_TEMP\tmate-address.txt" -Value $address
      - uses: actions/upload-artifact@v4
        with:
          name: windows-debug-connection
          path: ${{ runner.temp }}\tmate-address.txt
          retention-days: 1
