name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact release PR commit to validate
        required: false
        type: string
      recovery_tag:
        description: Published release tag to validate and publish
        required: false
        type: string
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.expected_sha || inputs.recovery_tag || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      package: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.selection.outputs.package }}
      release: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.release }}
      templates: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.templates }}
      website: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.selection.outputs.website == 'true' && 'true' || steps.filter.outputs.website }}
      full: ${{ steps.selection.outputs.full }}
      coverage: ${{ steps.selection.outputs.coverage }}
      selected_tests: ${{ steps.selection.outputs.selected_tests }}
      platforms: ${{ steps.selection.outputs.platforms }}
      consumers: ${{ steps.selection.outputs.consumers }}
      consumer_matrix: ${{ steps.selection.outputs.consumer_matrix }}
      native: ${{ steps.selection.outputs.native }}
      native_matrix: ${{ steps.selection.outputs.native_matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || inputs.expected_sha || github.sha }}
      - name: Verify dispatched request
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RECOVERY_TAG: ${{ inputs.recovery_tag }}
        run: |
          if [[ -n "$EXPECTED_SHA" && -n "$RECOVERY_TAG" ]] || [[ -z "$EXPECTED_SHA" && -z "$RECOVERY_TAG" ]]; then exit 1; fi
          if [[ -n "$EXPECTED_SHA" ]]; then
            test "$GITHUB_SHA" = "$EXPECTED_SHA" && test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          else
            test "$GITHUB_REF" = refs/heads/main && test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          fi
      - uses: dorny/paths-filter@v4
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          filters: |
            package:
              - 'LICENSE'
              - 'README.md'
              - 'bin/**'
              - '.oxfmtrc.json'
              - 'bun.lock'
              - 'bunfig.toml'
              - 'docker/**'
              - 'fallow.toml'
              - 'logo.svg'
              - 'osv-scanner.toml'
              - 'package.json'
              - 'scripts/**'
              - 'src/**'
              - 'templates/**'
              - 'tests/**'
              - 'tsconfig.json'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
              - '.github/workflows/package-consumers.yml'
            release:
              - 'bun.lock'
              - 'bunfig.toml'
              - 'release-please-config.json'
              - '.release-please-manifest.json'
              - '.github/workflows/release.yml'
              - 'bin/**'
              - 'package.json'
              - 'scripts/**'
              - 'src/**'
              - 'templates/**'
            templates:
              - 'templates/**'
            website:
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/ci.yml'
              - 'website/**'
              - '.github/workflows/docs.yml'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Select affected and previously failing areas
        id: selection
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/testing/ci-selection.ts

  package-static:
    name: Package static checks and distribution
    needs: changes
    if: ${{ needs.changes.outputs.package == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.expected_sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache/restore@v6
        id: bun_cache
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'bun.lock') }}-v1
      - name: Install package dependencies
        run: bun ci
      - uses: actions/cache/save@v6
        if: steps.bun_cache.outputs.cache-hit != 'true'
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'bun.lock') }}-v1
      - run: bun run tools:check
      - run: bun run templates:check
      - run: bun run prose:check
      - run: bun run lint
      - name: Validate skill
        if: ${{ needs.changes.outputs.templates == 'true' }}
        run: bun run skill:check
      - name: Validate evaluation fixtures
        if: ${{ needs.changes.outputs.templates == 'true' }}
        run: bun run evals:check
      - uses: actions/cache/restore@v6
        id: website_bun_cache
        with:
          path: ~/.bun/install/cache
          key: website-bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'website/package.json', 'website/bun.lock') }}-v1
      - name: Install website dependencies for Fallow
        run: bun ci --cwd website
      - uses: actions/cache/save@v6
        if: steps.website_bun_cache.outputs.cache-hit != 'true'
        with:
          path: ~/.bun/install/cache
          key: website-bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'website/package.json', 'website/bun.lock') }}-v1
      - name: Check dead code
        run: bun run fallow
      - name: Build one package archive
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/package-artifact"
          bun pm pack --filename "$RUNNER_TEMP/package-artifact/ast-mcp.tgz"
          bun -e 'const path = process.env.RUNNER_TEMP + "/package-artifact/ast-mcp.tgz"; await Bun.write(path + ".sha256", new Bun.CryptoHasher("sha256").update(await Bun.file(path).arrayBuffer()).digest("hex") + "\n")'
      - uses: actions/upload-artifact@v7
        with:
          name: package-candidate
          path: ${{ runner.temp }}/package-artifact/*
          if-no-files-found: error
          retention-days: 7

  package-consumers:
    name: Packed package consumers
    needs: [changes, package-static]
    if: ${{ needs.changes.outputs.consumers == 'true' }}
    uses: ./.github/workflows/package-consumers.yml
    with:
      artifact_name: package-candidate
      matrix: ${{ needs.changes.outputs.consumer_matrix }}
      checkout_ref: ${{ github.event.pull_request.head.sha || inputs.expected_sha || github.sha }}

  package-coverage:
    name: ${{ needs.changes.outputs.coverage == 'true' && 'Package tests and 95% coverage (Linux)' || 'Affected package tests (Linux)' }}
    needs: changes
    if: ${{ needs.changes.outputs.package == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.expected_sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache/restore@v6
        id: bun_cache
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'bun.lock') }}-v1
      - run: bun ci
      - uses: actions/cache/save@v6
        if: steps.bun_cache.outputs.cache-hit != 'true'
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'bun.lock') }}-v1
      - name: Warm formatter plugins
        run: bun run tools:check
      - name: Test package with 95% coverage
        if: needs.changes.outputs.coverage == 'true'
        env:
          AST_MCP_SKIP_PACKAGE_SMOKE: "1"
        run: bun run test:coverage
      - name: Test affected package files
        if: needs.changes.outputs.coverage != 'true'
        env:
          AST_MCP_SKIP_PACKAGE_SMOKE: "1"
          AST_MCP_SELECTED_TESTS: ${{ needs.changes.outputs.selected_tests }}
        run: bun scripts/testing/test-shard.ts --selected

  package-platform-tests:
    name: ${{ matrix.selected && format('Affected package tests ({0})', matrix.os) || format('Package tests ({0}, shard {1})', matrix.os, matrix.shard) }}
    needs: changes
    if: ${{ needs.changes.outputs.package == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.platforms) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.expected_sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache/restore@v6
        id: bun_cache
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'bun.lock') }}-v1
      - run: bun ci
      - uses: actions/cache/save@v6
        if: steps.bun_cache.outputs.cache-hit != 'true'
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'bun.lock') }}-v1
      - name: Warm formatter plugins
        run: bun run tools:check
      - name: Test package shard
        env:
          AST_MCP_SKIP_PACKAGE_SMOKE: "1"
          AST_MCP_SELECTED_TESTS: ${{ needs.changes.outputs.selected_tests }}
          SELECTED: ${{ matrix.selected }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
        run: |
          bun -e 'const args = process.env.SELECTED === "true" ? ["--selected"] : ["--shard", process.env.SHARD, "--shards", process.env.SHARDS]; const child = Bun.spawnSync([process.execPath, "scripts/testing/test-shard.ts", ...args], {stdio:"inherit"}); process.exit(child.exitCode ?? 1)'

  package-native:
    name: Native package qualification (${{ matrix.os }})
    needs: changes
    if: ${{ needs.changes.outputs.native == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.native_matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.expected_sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache/restore@v6
        id: bun_cache
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'bun.lock') }}-v1
      - run: bun ci
      - uses: actions/cache/save@v6
        if: steps.bun_cache.outputs.cache-hit != 'true'
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'bun.lock') }}-v1
      - name: Qualify native dependencies
        env:
          AST_MCP_QUALIFY_EMBEDDINGS: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: bun run intelligence:qualify
      - name: Verify CLI MCP stdio handshake
        run: bun test tests/integration/mcp.test.ts --test-name-pattern "CLI mcp subcommand remains alive for a stdio handshake"
      - name: Verify native MCP stdio handshake
        run: bun test tests/integration/mcp.test.ts --test-name-pattern "calls native code intelligence through the server"

  website:
    name: Website validation
    needs: changes
    if: ${{ needs.changes.outputs.website == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.expected_sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache/restore@v6
        id: bun_cache
        with:
          path: ~/.bun/install/cache
          key: website-bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'website/package.json', 'website/bun.lock') }}-v1
      - name: Install website dependencies
        run: bun ci --cwd website
      - uses: actions/cache/save@v6
        if: steps.bun_cache.outputs.cache-hit != 'true'
        with:
          path: ~/.bun/install/cache
          key: website-bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'website/package.json', 'website/bun.lock') }}-v1
      - name: Lint website
        run: bun run --cwd website lint
      - name: Test website
        run: bun run --cwd website test
      - name: Install Chromium for browser regressions
        run: bun run --cwd website playwright install --with-deps chromium
      - name: Validate root and Pages builds and browser behavior
        run: bun run --cwd website test:browser

  ci-acceptance:
    name: ${{ format('{0} CI acceptance [PR {1}; base {2}; website {3}]', needs.changes.outputs.package != 'true' && 'No package' || needs.changes.outputs.full == 'true' && 'Full' || 'Selected', github.event.pull_request.number || 0, github.event.pull_request.base.sha || github.sha, needs.changes.outputs.website == 'true' && 'true' || 'false') }}
    needs:
      [
        changes,
        package-static,
        package-coverage,
        package-platform-tests,
        package-consumers,
        package-native,
        website,
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v8
        env:
          RESULTS: ${{ toJSON(needs) }}
        with:
          script: |
            const results = JSON.parse(process.env.RESULTS);
            if (results.changes.result !== "success") core.setFailed("Change selection did not succeed");
            const packageExpected = results.changes.outputs.package === "true" ? "success" : "skipped";
            for (const key of ["package-static", "package-coverage", "package-platform-tests"]) {
              if (results[key].result !== packageExpected) core.setFailed(key + " did not cover its requested scope");
            }
            for (const [key, flag] of [["package-consumers", "consumers"], ["package-native", "native"], ["website", "website"]]) {
              const expected = results.changes.outputs[flag] === "true" ? "success" : "skipped";
              if (results[key].result !== expected) core.setFailed(key + " did not cover its requested scope");
            }
            await core.summary.addRaw(results.changes.outputs.package !== "true"
              ? "Documentation/website scope completed; package qualification was not requested."
              : results.changes.outputs.full === "true" ? "Full exact-head qualification completed."
              : "Affected scope completed. Full exact-head acceptance remains required before merge/release.").write();

  release:
    name: Release
    needs:
      [
        changes,
        package-static,
        package-consumers,
        package-coverage,
        package-platform-tests,
        package-native,
        website,
        ci-acceptance,
      ]
    if: ${{ always() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.recovery_tag != '')) && needs.changes.outputs.release == 'true' && needs.ci-acceptance.result == 'success' && needs.package-static.result == 'success' && needs.package-consumers.result == 'success' && needs.package-coverage.result == 'success' && needs.package-platform-tests.result == 'success' && needs.package-native.result == 'success' && (needs.website.result == 'success' || needs.website.result == 'skipped') }}
    uses: ./.github/workflows/release.yml
    with:
      recovery_tag: ${{ inputs.recovery_tag }}
    secrets:
      RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
    permissions:
      actions: write
      contents: write
      id-token: write
      pull-requests: write
