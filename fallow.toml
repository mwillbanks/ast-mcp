# The build script passes the CLI entry to Bun programmatically.
entry = ["bin/ast-mcp.ts"]

# Generated host-install surfaces and the standalone evaluator policy mirror are
# runtime copies validated by their source-owned tests, not independent source.
ignorePatterns = [
  ".github/hooks/**",
  ".github/skills/**",
  "templates/skills/ast-mcp/evals/shell-policy.ts",
]

# Fumadocs generates the collections aliases during documentation builds.
ignoreUnresolvedImports = ["collections/browser", "collections/server"]

# ast-bro and dprint are runtime CLI dependencies resolved from the stable package installation.
ignoreDependencies = ["@ast-bro/cli", "collections", "dprint"]

[duplicates]
# Surface every duplicated pair so architectural consolidation is comprehensive.
minOccurrences = 2

[rules]
# Legacy external-interface suppressions are retained for compatibility with Fallow's
# inability to model MCP Transport dispatch.
stale-suppressions = "off"
