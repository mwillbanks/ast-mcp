name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      package: ${{ steps.filter.outputs.package }}
      release: ${{ steps.filter.outputs.release }}
      templates: ${{ steps.filter.outputs.templates }}
      website: ${{ steps.filter.outputs.website }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            package:
              - 'LICENSE'
              - 'README.md'
              - 'bin/**'
              - 'biome.jsonc'
              - 'bun.lock'
              - 'bunfig.toml'
              - 'dprint.json'
              - 'docker/**'
              - 'fallow.toml'
              - 'logo.svg'
              - 'osv-scanner.toml'
              - 'package.json'
              - 'scripts/**'
              - 'src/**'
              - 'templates/**'
              - 'tests/**'
              - 'tsconfig.json'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
            release:
              - 'bin/**'
              - 'dprint.json'
              - 'package.json'
              - 'scripts/**'
              - 'src/**'
              - 'templates/**'
            templates:
              - 'templates/**'
            website:
              - 'website/**'
              - '.github/workflows/docs.yml'

  package-static:
    name: Package static checks and distribution
    needs: changes
    if: ${{ needs.changes.outputs.package == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache/restore@v6
        id: bun_cache
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'bun.lock') }}-v1
      - name: Install package dependencies
        run: bun ci
      - uses: actions/cache/save@v6
        if: steps.bun_cache.outputs.cache-hit != 'true'
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'bun.lock') }}-v1
      - run: bun run tools:check
      - run: bun run templates:check
      - run: bun run prose:check
      - run: bun run format:check
      - run: bun run typecheck
      - name: Validate skill
        if: ${{ needs.changes.outputs.templates == 'true' }}
        run: bun run skill:check
      - name: Validate evaluation fixtures
        if: ${{ needs.changes.outputs.templates == 'true' }}
        run: bun run evals:check
      - uses: actions/cache/restore@v6
        id: website_bun_cache
        with:
          path: ~/.bun/install/cache
          key: website-bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'website/package.json', 'website/bun.lock') }}-v1
      - name: Install website dependencies for Fallow
        run: bun ci --cwd website
      - uses: actions/cache/save@v6
        if: steps.website_bun_cache.outputs.cache-hit != 'true'
        with:
          path: ~/.bun/install/cache
          key: website-bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'website/package.json', 'website/bun.lock') }}-v1
      - name: Check dead code
        run: bun run fallow
      - name: Build and exercise extracted distribution once
        run: bun test tests/package-smoke.test.ts --bail

  package-coverage:
    name: Package tests and 95% coverage (Linux)
    needs: changes
    if: ${{ needs.changes.outputs.package == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache/restore@v6
        id: bun_cache
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'bun.lock') }}-v1
      - run: bun ci
      - uses: actions/cache/save@v6
        if: steps.bun_cache.outputs.cache-hit != 'true'
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'bun.lock') }}-v1
      - name: Test package with 95% coverage
        env:
          AST_MCP_SKIP_PACKAGE_SMOKE: "1"
        run: bun run test:coverage

  package-platform-tests:
    name: Package tests (${{ matrix.os }}, shard ${{ matrix.shard }})
    needs: changes
    if: ${{ needs.changes.outputs.package == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        shard: [0, 1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache/restore@v6
        id: bun_cache
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'bun.lock') }}-v1
      - run: bun ci
      - uses: actions/cache/save@v6
        if: steps.bun_cache.outputs.cache-hit != 'true'
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'bun.lock') }}-v1
      - name: Test package shard
        env:
          AST_MCP_SKIP_PACKAGE_SMOKE: "1"
        run: bun scripts/test-shard.ts --shard ${{ matrix.shard }} --shards 3

  package-native:
    name: Native package qualification (${{ matrix.os }})
    needs: changes
    if: ${{ needs.changes.outputs.package == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache/restore@v6
        id: bun_cache
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'bun.lock') }}-v1
      - run: bun ci
      - uses: actions/cache/save@v6
        if: steps.bun_cache.outputs.cache-hit != 'true'
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'bun.lock') }}-v1
      - name: Qualify native dependencies
        env:
          AST_MCP_QUALIFY_EMBEDDINGS: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: bun run intelligence:qualify
      - name: Verify CLI MCP stdio handshake
        run: bun test tests/mcp.test.ts --test-name-pattern "CLI mcp subcommand remains alive for a stdio handshake"
      - name: Verify native MCP stdio handshake
        run: bun test tests/mcp.test.ts --test-name-pattern "calls native code intelligence through the server"

  website:
    name: Website validation
    needs: changes
    if: ${{ needs.changes.outputs.website == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache/restore@v6
        id: bun_cache
        with:
          path: ~/.bun/install/cache
          key: website-bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'website/package.json', 'website/bun.lock') }}-v1
      - name: Install website dependencies
        run: bun ci --cwd website
      - uses: actions/cache/save@v6
        if: steps.bun_cache.outputs.cache-hit != 'true'
        with:
          path: ~/.bun/install/cache
          key: website-bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'website/package.json', 'website/bun.lock') }}-v1
      - name: Lint website
        run: bun run --cwd website lint
      - name: Typecheck website
        run: bun run --cwd website typecheck
      - name: Test website
        run: bun run --cwd website test
      - name: Build website
        env:
          VITE_BASE_PATH: /ast-mcp/
        run: bun run --cwd website build

  release:
    name: Release
    needs: [changes, package-static, package-coverage, package-platform-tests, package-native, website]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.release == 'true' && needs.package-static.result == 'success' && needs.package-coverage.result == 'success' && needs.package-platform-tests.result == 'success' && needs.package-native.result == 'success' && (needs.website.result == 'success' || needs.website.result == 'skipped') }}
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      id-token: write
      pull-requests: write
